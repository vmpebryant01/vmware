# Author: Paul Bryant
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vcf-api-collectors"
version = "2.0.0"
description = "Read-only API inventory collectors for VMware Cloud Foundation components"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Paul Bryant"}]
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.scripts]
vcf-collect = "vcf_inventory.cli:main"

[tool.setuptools.packages.find]
include = ["vcf_inventory*"]

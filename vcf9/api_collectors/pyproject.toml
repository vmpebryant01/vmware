# Author: Paul Bryant
[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "vcf-api-collectors"
version = "2.3.0"
description = "Read-only API inventory collectors for VMware Cloud Foundation components"
readme = "README.md"
license-files = ["COPYRIGHT.md"]
requires-python = ">=3.10"
authors = [{name = "Paul Bryant"}]
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.scripts]
vcf-collect = "vcf_inventory.cli:main"
vcf-compare = "vcf_inventory.compare:main"
vcf-relationships = "vcf_inventory.relationships:main"
vcf-report = "vcf_inventory.reporting:main"
vcf-validate-live = "vcf_inventory.live_validation:main"

[tool.setuptools.packages.find]
include = ["vcf_inventory*"]

name: Script checks

on: [push, pull_request]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Compile Python files
        run: python -m compileall -q nsx srm vsphere vcf9
      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse PowerShell files
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem -Path nsx,srm,vsphere,vcf9 -Filter *.ps1 -Recurse | ForEach-Object {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              $failed = $true
              $errors | ForEach-Object { Write-Error "$($_.Extent.File):$($_.Extent.StartLineNumber): $($_.Message)" }
            }
          }
          if ($failed) { exit 1 }

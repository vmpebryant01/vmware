# Author: Paul Bryant
name: Script checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  attribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check tracked files and reachable history
        run: python tools/check_attribution.py --repo . --all-history

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile Python files
        run: python -m compileall -q nsx srm vsphere vcf9
      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  toolkit:
    name: Toolkit (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14', '3.15']
        include:
          - os: windows-latest
            python-version: '3.10'
          - os: windows-latest
            python-version: '3.15'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run API collector unit tests
        working-directory: vcf9/api_collectors
        run: python -m unittest discover -s tests -v
      - name: Install isolated build dependencies
        run: python -m pip install --disable-pip-version-check build "setuptools>=77" wheel
      - name: Build, inspect and test an installed package
        run: python tools/build_and_check_package.py --work-dir "${{ runner.temp }}/package-check" --artifact-dir "${{ runner.temp }}/distributions" --expected-version 2.3.0

  powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse PowerShell files
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem -Path nsx,srm,vsphere,vcf9 -Filter *.ps1 -Recurse | ForEach-Object {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              $failed = $true
              $errors | ForEach-Object { Write-Error "$($_.Extent.File):$($_.Extent.StartLineNumber): $($_.Message)" }
            }
          }
          if ($failed) { exit 1 }
